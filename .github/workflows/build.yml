name: "Build APK"

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: "write"

jobs:
  build:
    name: "Build Debug APK"
    runs-on: "ubuntu-22.04"
    steps: [
      {
        name: "Checkout repository",
        uses: "actions/checkout@v4"
      },
      {
        name: "Set up Python 3.10",
        uses: "actions/setup-python@v5",
        with: {
          python-version: "3.10"
        }
      },
      {
        name: "Install System Dependencies",
        run: "sudo apt-get update && sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache lld patch libltdl-dev"
      },
      {
        name: "Install Buildozer and Cython",
        run: "python -m pip install --upgrade pip setuptools wheel && pip install buildozer==1.5.0 cython==0.29.36 virtualenv"
      },
      {
        name: "Configure Spec and Entry Point",
        run: "cp client.py main.py && printf '%s\\n' '[app]' 'title = Auction App' 'package.name = auctionapp' 'package.domain = org.auction' 'source.dir = .' 'source.include_exts = py,png,jpg,kv,atlas' 'version = 0.1' 'requirements = python3==3.10.12,hostpython3==3.10.12,kivy==2.3.0,requests,urllib3,chardet,idna,certifi,android' 'orientation = portrait' 'fullscreen = 0' 'android.permissions = INTERNET' 'android.api = 33' 'android.minapi = 21' 'android.ndk = 25b' 'android.ndk_api = 21' 'android.archs = arm64-v8a' 'android.accept_sdk_license = True' 'p4a.branch = v2024.01.21' '' '[buildozer]' 'log_level = 1' 'warn_on_root = 0' > buildozer.spec && cat buildozer.spec"
      },
      {
        name: "Build Debug APK with Buildozer",
        run: "buildozer android debug && cp bin/$(ls bin | head -n 1) auction-debug.apk"
      },
      {
        name: "Upload APK to GitHub Actions Artifacts",
        uses: "actions/upload-artifact@v4",
        with: {
          name: "auction-debug-apk",
          path: "auction-debug.apk"
        }
      },
      {
        name: "Attach APK to GitHub Release",
        uses: "softprops/action-gh-release@v2",
        with: {
          tag_name: "debug-latest",
          name: "Auction App Debug APK",
          files: "auction-debug.apk",
          prerelease: true
        },
        env: {
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        }
      }
    ]
