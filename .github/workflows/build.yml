name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: "Build Debug APK"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies & 32-bit Fix
        run: |
          # Включаем 32-битную архитектуру
          sudo dpkg --add-architecture i386
          sudo apt-get update
          
          # Ставим базовые пакеты и 32-битные библиотеки
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev ccache lld patch libc6:i386 libncurses5:i386 libstdc++6:i386 lib32z1 libbz2-1.0:i386
          
          # Скачиваем и принудительно ставим 32-битную libtinfo5 (без нее падает aidl)
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_i386.deb
          sudo dpkg -i --force-all libtinfo5_6.2-0ubuntu2_i386.deb || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36 virtualenv

      - name: Prepare Entry Point and Build APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          cp client.py main.py
          # Удаляем старый сломанный SDK из кэша, чтобы скачался заново
          rm -rf ~/.buildozer
          buildozer -v android debug

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auction-debug-apk
          path: bin/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Auction App Debug APK"
          files: bin/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
