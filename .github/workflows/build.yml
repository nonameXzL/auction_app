name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: "Build Debug APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK inside Kivy Docker container
        run: |
          # Запускаем сборку в официальном контейнере Kivy (внутри него Ubuntu 20.04 и все 32-битные библиотеки)
          docker run --rm -v "$PWD":/home/user/hostcwd kivy/buildozer:latest buildozer -v android debug

      - name: Fix file permissions
        run: |
          # Возвращаем права файлам, чтобы GitHub смог их скачать
          sudo chown -R $USER:$USER .

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auction-debug-apk
          path: bin/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Auction App Debug APK"
          files: bin/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
