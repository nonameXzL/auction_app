name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK in Docker Container
        run: |
          # Запускаем официальный Docker-образ Kivy/Buildozer
          # Он уже содержит все нужные старые библиотеки (включая aidl)
          docker run --rm -v "$PWD":/home/user/hostcwd kivy/buildozer:latest buildozer -v android debug

      - name: Fix file permissions
        run: |
          # Возвращаем права на файлы, чтобы GitHub смог их забрать
          sudo chown -R $USER:$USER .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auction-apk
          path: bin/*.apk
